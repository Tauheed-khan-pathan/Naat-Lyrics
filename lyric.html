<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naat Lyrics</title>
<meta id="metaDesc" name="description" content="Naat, Hamd, Salaam and Noha lyrics in Roman Urdu and Hindi.">
<meta property="og:title" id="ogTitle" content="Naat Lyrics">
<meta property="og:description" id="ogDesc" content="Naat, Hamd, Salaam and Noha lyrics in Roman Urdu and Hindi.">
<meta property="og:type" content="article">
<meta property="og:url" id="ogUrl" content="https://tauheed-khan-pathan.github.io/Naat-Lyrics/">
<meta name="description" content="Naat, Hamd, Salaam and Noha lyrics in Roman Urdu and Hindi.">
<link id="canonicalLink" rel="canonical" href="https://tauheed-khan-pathan.github.io/Naat-Lyrics/">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=10">
<script type="application/ld+json" id="lyricJsonLd">{"@context":"https://schema.org","@type":"WebPage","name":"Naat Lyrics"}</script>
</head>
<body>
<header class="site-header">
  <div class="bar">
    <a class="logo" href="index.html">Naat Lyrics</a>
    <div class="searchpill header-search">
      <svg class="sicon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="lyricSearch" type="text" placeholder="Search Naat" autocomplete="off" aria-label="Search Naat">
      <button id="lyricClear" class="sclear" aria-label="Clear search">✕</button>
    </div>
  </div>
  <nav class="lyric-toolbar">
    <div class="lyric-toolbar-row">
      <a class="lyric-back-btn" href="index.html">← Back</a>
      <div class="lang">
        <button data-lang="roman" class="active">Roman</button>
        <button data-lang="hindi">हिन्दी</button>
        <button type="button" title="Urdu — coming soon">اردو</button>
        <button id="fontUp" title="Increase font">A+</button>
        <button id="fontDown" title="Decrease font">A−</button>
        <button id="darkToggle" class="dark-btn" aria-label="Toggle dark mode"><svg class="dicon icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg><svg class="dicon icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
    </div>
  </nav>
</header>

<main id="one"></main>
<footer class="site-footer"><div class="foot-inner">
  <p class="foot-logo">Naat Lyrics</p>
  <p>Naat, Hamd, Salaam, Noha and Manqabat lyrics in Roman Urdu and Hindi, all in one place.</p>
  <p class="foot-cats">Naat &bull; Hamd &bull; Salaam &bull; Noha &bull; Manqabat</p>
  <p class="foot-copy">&copy; 2026 Naat Lyrics</p>
</div></footer>
<script>
let lang='roman', size=1.1;
const id=new URLSearchParams(location.search).get('id');
fetch('lyrics/'+encodeURIComponent(id)+'.json').then(r=>{if(!r.ok) throw new Error('not found'); return r.json();}).then(x=>{
  const el=document.getElementById('one');
  if(!x){el.innerHTML='<div class="empty"><p>This lyric was not found.</p><p><a href="index.html">Back to all lyrics</a></p></div>';return;}
  document.title=x.title+' Lyrics — Naat Lyrics';
  const pageUrl='https://tauheed-khan-pathan.github.io/Naat-Lyrics/lyric.html?id='+encodeURIComponent(x.id);
  const desc=('Read '+x.title+' lyrics in Roman Urdu and Hindi. Poet: '+x.poet+'. Category: '+x.category+'. '+(x.roman||[]).slice(0,2).join(' ')).slice(0,155);
  const setMeta=(id,attr,val)=>{const el=document.getElementById(id); if(el) el.setAttribute(attr,val);};
  setMeta('metaDesc','content',desc);
  setMeta('ogTitle','content',x.title+' Lyrics — Naat Lyrics');
  setMeta('ogDesc','content',desc);
  setMeta('ogUrl','content',pageUrl);
  setMeta('canonicalLink','href',pageUrl);
  const schema={"@context":"https://schema.org","@type":"MusicComposition","name":x.title,"genre":x.category,"inLanguage":"ur","lyrics":{"@type":"CreativeWork","text":(x.roman||[]).join('\n')}};
  if(x.poet && x.poet!=='Unknown') schema.lyricist={"@type":"Person","name":x.poet};
  const ld=document.getElementById('lyricJsonLd'); if(ld) ld.textContent=JSON.stringify(schema);
  function sherText(lines){const out=[]; for(let i=0;i<lines.length;i+=2){out.push(lines.slice(i,i+2).join('\n'));} return out.join('\n\n');}
  function render(){
    el.innerHTML=`<article class="card"><h2>${x.title}</h2><div class="meta">${x.category} • Shayar: ${x.poet}</div><div class="meta">Naat Khawan: ${x.khawan || 'Unknown'}</div><div class="lines" style="font-size:${size}rem">${sherText(x[lang])}</div>${x.note?`<div class="note">${x.note}</div>`:''}<button class="copy">Copy</button><a class="read" href="index.html">All Lyrics →</a></article>`;
    const b=el.querySelector('.copy');
    b.onclick=()=>{navigator.clipboard.writeText(x.title+'\n'+sherText(x[lang])); b.textContent='Copied ✓'; setTimeout(()=>b.textContent='Copy',1500);};
  }
  render();
  document.querySelectorAll('.lang button[data-lang]').forEach(b=>b.onclick=()=>{
    lang=b.dataset.lang;
    document.querySelectorAll('.lang button[data-lang]').forEach(y=>y.classList.toggle('active',y===b));
    render();
  });
  document.getElementById('fontUp').onclick=()=>{size=Math.min(1.4,size+0.1); render();};
  document.getElementById('fontDown').onclick=()=>{size=Math.max(0.9,size-0.1); render();};
}).catch(()=>{document.getElementById('one').innerHTML='<div class="empty"><p>This lyric was not found.</p><p><a href="index.html">Back to all lyrics</a></p></div>';});
</script>
<script>
(function(){var s=document.getElementById('lyricSearch'),c=document.getElementById('lyricClear');if(s){var sync=function(){if(c)c.classList.toggle('show',!!s.value);};s.addEventListener('input',sync);s.addEventListener('keydown',function(e){if(e.key==='Enter'&&s.value.trim()){location.href='index.html?q='+encodeURIComponent(s.value.trim());}});if(c)c.onclick=function(){s.value='';sync();s.focus();};sync();}})();
</script>
<script>
(function(){var b=document.getElementById('darkToggle');function apply(){var d=localStorage.getItem('naat-dark')==='1';document.body.classList.toggle('dark',d);}apply();if(b)b.onclick=function(){localStorage.setItem('naat-dark',document.body.classList.contains('dark')?'0':'1');apply();};})();
</script>
</body>
</html>
