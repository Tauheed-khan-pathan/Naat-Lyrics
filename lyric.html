<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naat Lyrics</title>
<meta name="description" content="Naat, Hamd, Salaam and Noha lyrics in Roman Urdu and Hindi.">
<link rel="canonical" href="https://tauheed-khan-pathan.github.io/Naat-Lyrics/">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="bar">
    <a class="logo" href="index.html">Naat Lyrics</a>
    <div class="lang">
      <button data-lang="roman" class="active">Roman</button>
      <button data-lang="hindi">हिन्दी</button>
      <button id="fontUp" title="Increase font">A+</button>
      <button id="fontDown" title="Decrease font">A−</button>
    </div>
  </div>
</header>
<div class="searchbar"><a class="back" href="index.html" style="display:block;max-width:960px;margin:0 auto;color:#0b3d2e;text-decoration:none">← All Lyrics</a></div>
<main id="one"></main>
<footer><p><strong>Naat Lyrics</strong> — Naat, Hamd, Salaam and Noha, all in one place.</p></footer>
<script>
let lang='roman', size=1.1;
const id=new URLSearchParams(location.search).get('id');
fetch('lyrics/'+encodeURIComponent(id)+'.json').then(r=>{if(!r.ok) throw new Error('not found'); return r.json();}).then(x=>{
  const el=document.getElementById('one');
  if(!x){el.innerHTML='<div class="empty"><p>This lyric was not found.</p><p><a href="index.html">Back to all lyrics</a></p></div>';return;}
  document.title=x.title+' Lyrics — Naat Lyrics';
  function render(){
    el.innerHTML=`<article class="card"><h2>${x.title}</h2><div class="meta">${x.category} • Poet: ${x.poet}</div><div class="meta">Naat Khawan: ${x.khawan || 'Unknown'}</div><div class="lines" style="font-size:${size}rem">${x[lang].join('\n')}</div><button class="copy">Copy</button><a class="read" href="index.html">All Lyrics →</a></article>`;
    const b=el.querySelector('.copy');
    b.onclick=()=>{navigator.clipboard.writeText(x.title+'\n'+x[lang].join('\n')); b.textContent='Copied ✓'; setTimeout(()=>b.textContent='Copy',1500);};
  }
  render();
  document.querySelectorAll('.lang button[data-lang]').forEach(b=>b.onclick=()=>{
    lang=b.dataset.lang;
    document.querySelectorAll('.lang button[data-lang]').forEach(y=>y.classList.toggle('active',y===b));
    render();
  });
  document.getElementById('fontUp').onclick=()=>{size=Math.min(1.4,size+0.1); render();};
  document.getElementById('fontDown').onclick=()=>{size=Math.max(0.9,size-0.1); render();};
}).catch(()=>{document.getElementById('one').innerHTML='<div class="empty"><p>This lyric was not found.</p><p><a href="index.html">Back to all lyrics</a></p></div>';});
</script>
</body>
</html>
